<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroVC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <style>
      :root {
        --accent: rgb(99, 102, 241);
        --bg: rgb(13, 17, 23);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: #e5e7eb;
        font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: drag;
      }
      .wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; }
      .mark { position: relative; width: 116px; height: 116px; }
      .ring {
        position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0%, var(--accent) 35%, transparent 65%, transparent 100%);
        animation: spin 1.5s linear infinite;
        filter: blur(0.5px);
        opacity: 0.9;
      }
      .ring::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--bg); }
      .core {
        position: absolute; inset: 14px; border-radius: 50%;
        background: var(--accent);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 46px var(--accent);
        animation: pulse 1.9s ease-in-out infinite;
      }
      .core svg { width: 52px; height: 52px; display: block; }
      .title { font-size: 22px; font-weight: 800; letter-spacing: 0.02em; }
      .status { font-size: 13px; color: #9ca3af; min-height: 18px; }
      .bar {
        width: 220px; height: 4px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden; opacity: 0; transition: opacity 0.3s ease;
      }
      .bar.active { opacity: 1; }
      .bar > i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 999px; transition: width 0.25s ease; }
      .watermark { position: absolute; bottom: 14px; font-size: 11px; color: #4b5563; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">
        <div class="ring"></div>
        <div class="core">
          <!-- Logo ZeroVC (Z branco) dentro do círculo na cor de destaque -->
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="8,8 24,8 24,11.5 13.5,20.5 24,20.5 24,24 8,24 8,20.5 18.5,11.5 8,11.5" fill="#FFFFFF" />
          </svg>
        </div>
      </div>
      <div class="title">ZeroVC</div>
      <div class="status" id="status">Iniciando…</div>
      <div class="bar" id="bar"><i id="fill"></i></div>
    </div>
    <div class="watermark">zerovc.safiroko.xyz</div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var accent = params.get("accent");
        var bg = params.get("bg");
        if (accent) document.documentElement.style.setProperty("--accent", "rgb(" + accent + ")");
        if (bg) document.documentElement.style.setProperty("--bg", "rgb(" + bg + ")");

        var statusEl = document.getElementById("status");
        var bar = document.getElementById("bar");
        var fill = document.getElementById("fill");

        window.electronAPI &&
          window.electronAPI.onSplashUpdate &&
          window.electronAPI.onSplashUpdate(function (d) {
            if (!d) return;
            if (d.phase === "checking") {
              statusEl.textContent = "Verificando atualizações…";
            } else if (d.phase === "downloading") {
              var pct = typeof d.percent === "number" ? d.percent : 0;
              statusEl.textContent = "Baixando atualização… " + pct + "%";
              bar.classList.add("active");
              fill.style.width = pct + "%";
            } else if (d.phase === "installing") {
              statusEl.textContent = "Instalando atualização…";
              bar.classList.add("active");
              fill.style.width = "100%";
            } else if (d.phase === "error") {
              statusEl.textContent = "Não foi possível atualizar. Abrindo…";
              bar.classList.remove("active");
            }
          });
      })();
    </script>
  </body>
</html>
