<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroVC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <style>
      :root {
        --bg: rgb(13, 17, 23);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; width: 100%; }
      body {
        background: var(--bg);
        color: #ffffff;
        font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: drag;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 8px;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: 100%;
        padding: 0 24px;
      }
      .logo {
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo svg {
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.15));
      }
      .title {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #ffffff;
      }
      .status {
        font-size: 12px;
        font-weight: 500;
        color: #9ca3af;
        min-height: 16px;
        text-align: center;
      }
      .bar {
        width: 180px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      .bar.active {
        opacity: 1;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0%;
        background: #ffffff;
        border-radius: 999px;
        transition: width 0.2s ease;
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="8,8 24,8 24,11.5 13.5,20.5 24,20.5 24,24 8,24 8,20.5 18.5,11.5 8,11.5" fill="#FFFFFF" />
        </svg>
      </div>
      <div class="title">ZeroVC</div>
      <div class="status" id="status">Iniciando…</div>
      <div class="bar" id="bar"><i id="fill"></i></div>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var bg = params.get("bg");
        if (bg) document.documentElement.style.setProperty("--bg", "rgb(" + bg + ")");

        var statusEl = document.getElementById("status");
        var bar = document.getElementById("bar");
        var fill = document.getElementById("fill");

        window.electronAPI &&
          window.electronAPI.onSplashUpdate &&
          window.electronAPI.onSplashUpdate(function (d) {
            if (!d) return;
            if (d.phase === "checking") {
              statusEl.textContent = "Verificando atualizações…";
            } else if (d.phase === "downloading") {
              var pct = typeof d.percent === "number" ? d.percent : 0;
              statusEl.textContent = "Baixando atualização… " + pct + "%";
              bar.classList.add("active");
              fill.style.width = pct + "%";
            } else if (d.phase === "installing") {
              statusEl.textContent = "Instalando atualização…";
              bar.classList.add("active");
              fill.style.width = "100%";
            } else if (d.phase === "error") {
              statusEl.textContent = "Não foi possível atualizar. Abrindo…";
              bar.classList.remove("active");
            }
          });
      })();
    </script>
  </body>
</html>
