name: Build & Release Apps (Windows, Linux, Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Rust ScreenShare Sidecar (Windows)
        working-directory: client/native/native-screenshare
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force -Path ..\bin | Out-Null
          Copy-Item -Force target\release\zerovc-screenshare.exe ..\bin\zerovc-screenshare.exe

      - name: Build Native Audio Capture Sidecar (Windows)
        run: |
          New-Item -ItemType Directory -Force -Path client\native\bin | Out-Null
          cl.exe /nologo /EHsc /O2 /std:c++17 /Fe:client\native\bin\zerovc-audio-capture.exe client\native\process_audio_capture.cpp /link ole32.lib mmdevapi.lib runtimeobject.lib user32.lib uuid.lib

      - name: Build Frontend
        working-directory: client
        run: npm run build

      - name: Build Tauri Windows NSIS Installer
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Collect Windows Artifacts
        run: |
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          $nsis = Get-ChildItem -Path client\src-tauri\target\release\bundle\nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $nsis) { throw "Windows NSIS installer not found in client\src-tauri\target\release\bundle\nsis" }
          Copy-Item -Force $nsis.FullName release-out\ZeroVC-Setup.exe
          $sig = "$($nsis.FullName).sig"
          if (Test-Path $sig) {
            Copy-Item -Force $sig release-out\ZeroVC-Setup.exe.sig
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroVC-windows
          path: release-out/*

  release-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Install Linux Tauri, GStreamer WebRTC & native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            lsb-release \
            wget \
            software-properties-common \
            gnupg \
            rpm \
            libarchive-tools \
            libssl-dev \
            pkg-config \
            libglib2.0-dev \
            libva-dev \
            libasound2-dev \
            libv4l-dev
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Rust ScreenShare Sidecar (Linux)
        working-directory: client/native/native-screenshare
        env:
          CC: clang-21
          CXX: clang++-21
        run: |
          cargo build --release
          mkdir -p ../bin
          cp -f target/release/zerovc-screenshare ../bin/zerovc-screenshare
          chmod +x ../bin/zerovc-screenshare

      - name: Build Frontend
        working-directory: client
        run: npm run build

      - name: Build Tauri Linux Bundles (.deb, .rpm, AppImage)
        working-directory: client
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles deb,rpm,appimage

      - name: Collect Linux Artifacts
        run: |
          mkdir -p release-out
          DEB=$(find client/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -n 1)
          RPM=$(find client/src-tauri/target/release/bundle/rpm -maxdepth 1 -name '*.rpm' | head -n 1)
          APPIMAGE=$(find client/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)
          [ -n "$DEB" ] && cp -f "$DEB" release-out/ZeroVC.deb
          [ -n "$RPM" ] && cp -f "$RPM" release-out/ZeroVC.rpm
          if [ -n "$APPIMAGE" ]; then
            cp -f "$APPIMAGE" release-out/ZeroVC.AppImage
            [ -f "${APPIMAGE}.sig" ] && cp -f "${APPIMAGE}.sig" release-out/ZeroVC.AppImage.sig
          fi
          ls -la release-out

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroVC-linux
          path: release-out/*

  release-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build Web & Sync Capacitor Android
        working-directory: client
        run: |
          npm run build
          npx cap sync android

      - name: Build Release APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../ZeroVC.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroVC-android
          path: ZeroVC.apk

  publish-and-deploy-vps:
    needs: [release-windows, release-linux, release-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloads-out
          merge-multiple: true

      - name: Generate Tauri Updater latest.json
        run: |
          node -e '
            const fs = require("fs");
            const pkg = require("./client/package.json");
            const repo = process.env.GITHUB_REPOSITORY || "safiroko/zerovc";
            const tag = `v${pkg.version}`;
            const platforms = {};
            if (fs.existsSync("downloads-out/ZeroVC-Setup.exe.sig")) {
              platforms["windows-x86_64"] = {
                signature: fs.readFileSync("downloads-out/ZeroVC-Setup.exe.sig", "utf8").trim(),
                url: `https://github.com/${repo}/releases/download/${tag}/ZeroVC-Setup.exe`
              };
            }
            if (fs.existsSync("downloads-out/ZeroVC.AppImage.sig")) {
              platforms["linux-x86_64"] = {
                signature: fs.readFileSync("downloads-out/ZeroVC.AppImage.sig", "utf8").trim(),
                url: `https://github.com/${repo}/releases/download/${tag}/ZeroVC.AppImage`
              };
            }
            const manifest = {
              version: tag,
              notes: `ZeroVC ${tag}`,
              pub_date: new Date().toISOString(),
              platforms
            };
            fs.writeFileSync("downloads-out/latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Upload Release Artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./client/package.json').version")
          TAG="v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" downloads-out/* --clobber

      - name: Deploy Installers & Latest Metadata to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "VPS secrets not configured; skipping VPS upload."
            exit 0
          fi
          PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_OPTS="-i ~/.ssh/vps_key -p $PORT -o StrictHostKeyChecking=no"
          REPO_DIR=$(ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" 'if [ -d /root/zerovc ]; then echo /root/zerovc; else echo "$HOME/zerovc"; fi')
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "mkdir -p \"$REPO_DIR/backend/web/downloads\" \"$HOME/zerovc-downloads\""
          scp -i ~/.ssh/vps_key -P "$PORT" -o StrictHostKeyChecking=no downloads-out/* "$VPS_USER@$VPS_HOST:$HOME/zerovc-downloads/"
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "cp -f \"$HOME/zerovc-downloads/\"* \"$REPO_DIR/backend/web/downloads/\""
          rm -f ~/.ssh/vps_key
