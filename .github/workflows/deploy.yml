name: Deploy to VPS via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Executar Deploy Remoto via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            echo "🚀 Iniciando deploy no servidor..."
            
            # Navegar até o diretório do projeto
            # OBS: Ajuste o caminho abaixo se seu repositório estiver em outro diretório
            cd /root/zerovc || cd ~/zerovc
            
            echo "📥 Puxando alterações da branch main..."
            git reset --hard HEAD
            git pull origin main
            
            echo "🐳 Reconstruindo e reiniciando os containers..."
            if [ -f "deploy/docker-compose.yml" ]; then
              cd deploy && docker compose up -d --build
            else
              docker compose up -d --build
            fi
            
            echo "🧹 Limpando imagens antigas não utilizadas..."
            docker image prune -f
            
            echo "✅ Deploy concluído com sucesso!"
