version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zerovc-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-tuned.conf:/etc/postgresql/postgresql.conf
      - ../backend/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/01_init.sql
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - zerovc-net
    deploy:
      resources:
        limits:
          memory: 256M

  livekit:
    image: livekit/livekit-server:latest
    container_name: zerovc-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    env_file:
      - .env
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    ports:
      - "7880:7880"         # HTTP/WebSocket API
      - "7881:7881"         # TCP fallback
      - "7882:7882/udp"     # UDP WebRTC media
      - "50000-50050:50000-50050/udp" # WebRTC ICE UDP range
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.zerovc-livekit-http.rule=Host(`${LIVEKIT_DOMAIN}`)"
      - "traefik.http.routers.zerovc-livekit-http.entrypoints=http"
      - "traefik.http.routers.zerovc-livekit-http.service=zerovc-livekit"
      - "traefik.http.routers.zerovc-livekit.rule=Host(`${LIVEKIT_DOMAIN}`)"
      - "traefik.http.routers.zerovc-livekit.entrypoints=https"
      - "traefik.http.routers.zerovc-livekit.tls=true"
      - "traefik.http.routers.zerovc-livekit.tls.certresolver=letsencrypt"
      - "traefik.http.routers.zerovc-livekit.service=zerovc-livekit"
      - "traefik.http.services.zerovc-livekit.loadbalancer.server.port=7880"
    networks:
      - zerovc-net
      - coolify
    deploy:
      resources:
        limits:
          memory: 300M

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: zerovc-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - livekit
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@zerovc-postgres:5432/${POSTGRES_DB}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET}"
      LIVEKIT_URL: "ws://livekit:7880"
      LIVEKIT_PUBLIC_URL: "wss://${LIVEKIT_DOMAIN}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
    volumes:
      - ../assets:/app/assets
      - ../backend/web:/app/web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.zerovc-backend-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.zerovc-backend-http.entrypoints=http"
      - "traefik.http.routers.zerovc-backend-http.service=zerovc-backend"
      - "traefik.http.routers.zerovc-backend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.zerovc-backend.entrypoints=https"
      - "traefik.http.routers.zerovc-backend.tls=true"
      - "traefik.http.routers.zerovc-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.zerovc-backend.service=zerovc-backend"
      - "traefik.http.services.zerovc-backend.loadbalancer.server.port=8080"
    networks:
      - zerovc-net
      - coolify
    deploy:
      resources:
        limits:
          memory: 150M

volumes:
  pgdata:

networks:
  zerovc-net:
    driver: bridge
  coolify:
    external: true

