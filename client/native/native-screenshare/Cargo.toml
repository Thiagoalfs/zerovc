[package]
name = "zerovc-screenshare"
version = "0.1.0"
edition = "2021"
description = "Native low-latency LiveKit screen share sidecar for ZeroVC (Windows WGC+WASAPI / Linux Wayland+X11+PipeWire)"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
livekit = { version = "0.12", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "process", "sync", "time", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "1.5"
